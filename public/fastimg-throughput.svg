<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">FastImg measured throughput</title>
  <desc id="desc">Horizontal bar chart of five FastImg configurations measured with five serial jobs each. At 1024 by 1024 pixels: Diffusers MPS with SDXL-Lightning reached 133 images per hour with a 26.25 second mean and 27.86 second p90; MLX with SDXL-Turbo reached 172 images per hour with a 20.94 second mean and 24.87 second p90; quantized MLX reached 286 images per hour with a 12.58 second mean and 15.64 second p90. At 768 by 768 pixels: quantized MLX reached 552 images per hour with a 6.53 second mean and 7.38 second p90; a style-constrained sample reached 595 images per hour with a 6.05 second mean and 6.23 second p90, but was not shipped.</desc>

  <defs>
    <linearGradient id="quantized" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5664F5"/>
      <stop offset="1" stop-color="#735BE8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#11182D" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 780; fill: #11182D; }
      .subtitle { font-size: 19px; font-weight: 500; fill: #687184; }
      .group { font-size: 15px; font-weight: 780; letter-spacing: 2.4px; fill: #5664F5; }
      .label { font-size: 23px; font-weight: 760; fill: #192136; }
      .detail { font-size: 17px; font-weight: 520; fill: #687184; }
      .metric { font-size: 16px; font-weight: 620; fill: #687184; }
      .value { font-size: 19px; font-weight: 780; fill: #FFFFFF; }
      .tick { font-size: 14px; font-weight: 650; fill: #8A92A2; }
      .note { font-size: 15px; font-weight: 520; fill: #687184; }
    </style>
  </defs>

  <rect width="1200" height="850" rx="32" fill="#F7F6F3"/>
  <g filter="url(#shadow)">
    <rect x="30" y="30" width="1140" height="790" rx="28" fill="#FFFFFF"/>
  </g>

  <text x="72" y="82" class="title">Measured throughput</text>
  <text x="72" y="116" class="subtitle">Images per hour · higher is better</text>
  <g transform="translate(936 58)">
    <rect width="176" height="44" rx="22" fill="#EEF0FF"/>
    <circle cx="24" cy="22" r="7" fill="#5664F5"/>
    <text x="42" y="28" font-size="14" font-weight="760" letter-spacing="1.5" fill="#3945C8">FASTIMG · M1</text>
  </g>

  <g stroke="#E8EAF0" stroke-width="1">
    <line x1="420" y1="158" x2="420" y2="714"/>
    <line x1="585" y1="158" x2="585" y2="714"/>
    <line x1="750" y1="158" x2="750" y2="714"/>
    <line x1="915" y1="158" x2="915" y2="714"/>
    <line x1="1080" y1="158" x2="1080" y2="714"/>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="420" y="148">0</text>
    <text x="585" y="148">150</text>
    <text x="750" y="148">300</text>
    <text x="915" y="148">450</text>
    <text x="1080" y="148">600</text>
  </g>

  <text x="72" y="168" class="group">1024 × 1024</text>

  <text x="72" y="211" class="label">Diffusers / MPS</text>
  <text x="72" y="237" class="detail">SDXL-Lightning · one step</text>
  <rect x="420" y="188" width="146" height="50" rx="12" fill="#8D96A8"/>
  <text x="552" y="220" class="value" text-anchor="end">133 / hr</text>
  <text x="420" y="260" class="metric">mean 26.25s · p90 27.86s</text>

  <text x="72" y="307" class="label">MLX</text>
  <text x="72" y="333" class="detail">SDXL-Turbo</text>
  <rect x="420" y="284" width="189" height="50" rx="12" fill="#7580E9"/>
  <text x="595" y="316" class="value" text-anchor="end">172 / hr</text>
  <text x="420" y="356" class="metric">mean 20.94s · p90 24.87s</text>

  <text x="72" y="403" class="label">MLX · quantized</text>
  <text x="72" y="429" class="detail">SDXL-Turbo</text>
  <rect x="420" y="380" width="315" height="50" rx="12" fill="url(#quantized)"/>
  <text x="721" y="412" class="value" text-anchor="end">286 / hr</text>
  <text x="420" y="452" class="metric">mean 12.58s · p90 15.64s</text>

  <line x1="72" y1="482" x2="1112" y2="482" stroke="#DEE2E9" stroke-width="2"/>
  <text x="72" y="516" class="group" fill="#008F80">768 × 768</text>

  <text x="72" y="558" class="label">MLX · quantized</text>
  <text x="72" y="584" class="detail">SDXL-Turbo</text>
  <rect x="420" y="535" width="607" height="50" rx="12" fill="#45AA9C"/>
  <text x="1013" y="567" class="value" text-anchor="end">552 / hr</text>
  <text x="420" y="607" class="metric">mean 6.53s · p90 7.38s</text>

  <text x="72" y="655" class="label">Style-constrained sample</text>
  <text x="72" y="681" font-size="17" font-weight="700" fill="#B87613">fastest sample · not shipped</text>
  <rect x="420" y="632" width="655" height="50" rx="12" fill="#E2A13A"/>
  <text x="1061" y="664" class="value" text-anchor="end">595 / hr</text>
  <text x="420" y="704" class="metric">mean 6.05s · p90 6.23s</text>

  <line x1="72" y1="732" x2="1112" y2="732" stroke="#DEE2E9" stroke-width="2"/>
  <text x="72" y="760" class="note">Five serial jobs per configuration. Throughput is derived from mean render time.</text>
  <text x="72" y="784" class="note">Resolution changed between groups; compare within a group before comparing across groups.</text>
</svg>
