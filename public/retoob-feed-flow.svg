<svg xmlns="http://www.w3.org/2000/svg" width="360" height="346" viewBox="0 0 360 346" role="img" aria-labelledby="title desc">
  <title id="title">Independent video feeds</title>
  <desc id="desc">A community and a personal list have separate publishers and public feed URLs. Both feeds are consumed directly by a compatible reader, which uses the original provider for playback.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#64766e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke="#64766e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M90 58 V77"/>
    <path d="M270 58 V77"/>
    <path d="M90 120 V139"/>
    <path d="M270 120 V139"/>
    <path d="M90 192 V218"/>
    <path d="M270 192 V218"/>
    <path d="M180 270 V292"/>
  </g>
  <g fill="#f6f8f7" stroke="#b8c3bd" stroke-width="1.2">
    <rect x="8" y="8" width="164" height="50" rx="7"/>
    <rect x="188" y="8" width="164" height="50" rx="7"/>
    <rect x="8" y="78" width="164" height="42" rx="7"/>
    <rect x="188" y="78" width="164" height="42" rx="7"/>
    <rect x="36" y="220" width="288" height="50" rx="7"/>
    <rect x="36" y="294" width="288" height="44" rx="7"/>
  </g>
  <g fill="#e1f3e9" stroke="#63967d" stroke-width="1.3">
    <rect x="8" y="140" width="164" height="52" rx="7"/>
    <rect x="188" y="140" width="164" height="52" rx="7"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle" fill="#24332d">
    <text x="90" y="29">Community</text>
    <text x="270" y="29">Personal list</text>
    <text x="90" y="104">Source connector</text>
    <text x="270" y="104">Manual publisher</text>
    <text x="90" y="161">Public feed A</text>
    <text x="270" y="161">Public feed B</text>
    <text x="180" y="241">Any compatible reader</text>
    <text x="180" y="321">Original video provider</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#4a6257">
    <text x="90" y="46">HN, Reddit, websites</text>
    <text x="270" y="46">Hand-curated</text>
    <text x="90" y="179">HTTPS / JSON</text>
    <text x="270" y="179">HTTPS / JSON</text>
    <text x="180" y="258">Subscribes to both URLs</text>
  </g>
</svg>
